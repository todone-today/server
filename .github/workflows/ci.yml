name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    # main -> production: the API on the VPS (api.todone.today and app.todone.today, docker compose in /root/todone).
    # It backs up the database, pulls this commit, rebuilds the server, which migrates the database as it starts,
    # and waits until it answers. Skipped until VPS_SSH_KEY is set.
    if: github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      VPS: ${{ vars.VPS_HOST }}
    steps:
      - name: Deploy to the VPS
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning::VPS_SSH_KEY secret is not set; skipping deploy"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          ssh root@"$VPS" "GIT_SHA=$GITHUB_SHA bash -s" <<'DEPLOY'
          set -euo pipefail
          cd /root/todone
          mkdir -p /root/todone-backups
          docker exec todone-db-1 pg_dump -U todone todone | gzip > "/root/todone-backups/todone-$(date +%Y%m%d-%H%M%S).sql.gz"
          ls -1t /root/todone-backups/todone-*.sql.gz | tail -n +31 | xargs -r rm --
          git fetch -q origin && git checkout -q main && git merge --ff-only -q "$GIT_SHA"
          docker compose build server
          docker compose up -d --no-deps server caddy
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          for i in $(seq 1 30); do docker exec todone-server-1 wget -qO- http://localhost:4000/api/health >/dev/null 2>&1 && exit 0; sleep 2; done
          docker logs --tail 30 todone-server-1; exit 1
          DEPLOY
