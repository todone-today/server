name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    # main -> production. On Fly.io (todone-api, behind app.todone.today) once FLY_API_TOKEN is set: it migrates the
    # database as it starts. Until then, Vercel (todone-server.vercel.app), whose build migrates the database.
    if: github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_NNPaLOvnhZx4WAk5fFqcBoW8
      VERCEL_PROJECT_ID: prj_CK3qKEWLmAayjPeqWD3qMoxTQq65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy to Fly
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Migrate and deploy (Vercel)
        if: env.FLY_API_TOKEN == ''
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set; skipping deploy"
            exit 0
          fi
          npm i -g vercel@57
          # The build migrates the database (it can read the encrypted DATABASE_URL; CI can't).
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
