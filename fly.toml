# todone's API on Fly.io: always on, private (no public address). The app's address (app.todone.today, the
# todone-app Fly app in the clients repo) passes /api to it over Fly's private network: todone-api.internal:4000.
# Deploy: fly deploy (CI does it on main). Secrets: fly secrets set DATABASE_URL=… BETTER_AUTH_SECRET=… (see
# .env.example); BETTER_AUTH_URL=https://app.todone.today, BETTER_AUTH_TRUSTED_ORIGINS=https://todone.today.
app = "todone-api"
primary_region = "sin" # keep it in the database's region (Neon): set to match before the first deploy

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# No [http_service]: nothing on the internet reaches it directly. One machine always running, so no cold starts.
[[services]]
  internal_port = 4000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/api/health"
