# Runs todone: Postgres, the server, the web app, reminders, and (optionally) a Cloudflare Tunnel.
#   docker compose up -d --build                 then open http://localhost:3000
#   docker compose --profile tunnel up -d        also starts the tunnel (needs CLOUDFLARE_TUNNEL_TOKEN)
#   docker compose up -d db server reminders caddy
#                                                the API alone on a VPS, at https://$API_DOMAIN, with the web app
#                                                elsewhere (Vercel) forwarding /api to it (needs PROXY_SECRET)
# Settings come from the environment or a .env file next to this one; see .env.example.
# The server builds from this repo; the web app straight from github.com/todone-today/clients.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: todone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todone}
      POSTGRES_DB: todone
    ports:
      - "127.0.0.1:54329:5432" # this machine only, for running the server outside Docker
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "todone"]
      interval: 2s
      retries: 30

  server:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://todone:${POSTGRES_PASSWORD:-todone}@db:5432/todone
      # The public address is the web app's: people sign in through it.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-todone <hello@todone.today>}
      SENTRY_DSN: ${SENTRY_DSN:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-todone-files}
      # Paid plans (actions/billing.ts): off unless both keys and BILLING_START are set.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      BILLING_START: ${BILLING_START:-}
      BILLING_NAME: ${BILLING_NAME:-}
      BILLING_ADDRESS: ${BILLING_ADDRESS:-}
      BILLING_GSTIN: ${BILLING_GSTIN:-}
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: https://github.com/todone-today/clients.git#main:apps/web
      args:
        SERVER_URL: http://server:4000
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - server

  # Sends due push reminders: calls the app every 10 minutes (needs CRON_SECRET; does nothing without it).
  reminders:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          sleep 600
          [ -n "$$CRON_SECRET" ] && curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://server:4000/api/cron/notify
        done
    depends_on:
      - server

  # The public address: a Cloudflare Tunnel to the app. Make a tunnel in Cloudflare Zero Trust whose
  # public hostname points at http://web:3000, and set CLOUDFLARE_TUNNEL_TOKEN.
  tunnel:
    image: cloudflare/cloudflared:2024.10.1
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

  # HTTPS for the API on its own address, for a web app hosted elsewhere. Only port 443: certificates come by the
  # TLS-ALPN challenge, so port 80 can stay with something else. Requests without the web app's PROXY_SECRET
  # header are refused, which is what makes the client IP it forwards trustworthy for rate limits.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: [api]
    command:
      - sh
      - -c
      - '[ -n "$$PROXY_SECRET" ] || { echo "Set PROXY_SECRET first"; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
      PROXY_SECRET: ${PROXY_SECRET:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - server

volumes:
  pg:
  data:
  caddy:
